name: Release

# Push a tag like v0.1.0 (must match package.json "version") to cut a release.
# The job publishes to npm (with provenance) and creates a GitHub Release.
# Both steps are idempotent — re-running on an existing version/tag is a no-op.
on:
  push:
    tags: ['v*']
  # Re-run a release for an existing tag (e.g. after a failed publish) with the
  # current workflow, without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.5.3'
        required: true

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing (OIDC) needs npm >= 11.5.1; no NPM_TOKEN involved.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build

      - name: Verify tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${RELEASE_TAG}" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match package.json version ${PKG}"
            exit 1
          fi

      # Auth is npm trusted publishing: npmjs.com package settings must list
      # this repo + release.yml as a trusted publisher. Provenance is automatic.
      - name: Publish to npm (skip if already published)
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
            echo "${NAME}@${VER} already on npm — skipping publish."
          else
            npm publish --access public
          fi

      - name: Create GitHub Release (skip if it exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists — skipping."
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
